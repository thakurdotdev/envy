name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: appuser
          POSTGRES_DB: envy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d envy"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://appuser:appuser@localhost:5432/envy
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Nothing here pushes, so the git token is not kept on disk.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Reads the exact version from the packageManager field.
          bun-version-file: package.json

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install
        run: bun install --frozen-lockfile

      # The dashboard's browser test needs Chromium and its system libraries.
      - name: Install Chromium for Playwright
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      # Includes the integration tests, which use the Postgres service above.
      - name: Format, lint, type check and tests
        run: bun run verify

      # Proves the committed migrations apply to a clean database, the same
      # way the release step runs them.
      - name: Database migrations
        run: bun run db:migrate

  build:
    name: Build binaries
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Nothing here pushes, so the git token is not kept on disk.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --filter @envy/cli --filter @envy/api build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-linux-x64
          path: |
            apps/cli/dist/envy
            apps/api/dist/envy-api
          retention-days: 7
